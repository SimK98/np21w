<H3><B>Sound option - WaveStar</B></H3>

<P><IMG SRC="images/sndws.gif" BORDER="0" ALT="Sound option"></P>

<DL>
<DT><B>I/O port</B></DT>
<DD><P>WaveStarのポートを設定します。</P></DD>
</DL>

<DL>
<DT><B>DMA</B></DT>
<DD><P>WaveStarのDMAチャネルを設定します。</P></DD>
</DL>

<DL>
<DT><B>Interrupt</B></DT>
<DD><P>WaveStarの割り込み番号を設定します。</P></DD>
</DL>

<DL>
<DT><B>Enable 86-compatible PCM</B></DT>
<DD><P>86音源互換PCM機能を有効化します。</P></DD>
</DL>

<DL>
<DT><B>Enable PnP</B></DT>
<DD><P>プラグアンドプレイを有効化します。Windowsドライバを使用する場合に必要です。</P></DD>
</DL>
