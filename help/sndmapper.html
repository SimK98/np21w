<H3><B>Sound option - Mapper</B></H3>

<P><IMG SRC="images/sndmapper.gif" BORDER="0" ALT="Sound option"></P>

<P>
ハードウェア関連サウンドのみを別の出力デバイスに振り分けできます。
</P>

<DL>
<DT><B>FDD output</B></DT>
<DD><P>FDDシーク音の出力先デバイスを指定します。</P></DD>
</DL>

<DL>
<DT><B>FDD volume</B></DT>
<DD><P>FDDシーク音の音量を指定します。</P></DD>
</DL>

<DL>
<DT><B>Board output</B></DT>
<DD><P>リレー音等の出力先デバイスを指定します。</P></DD>
</DL>

<DL>
<DT><B>Board volume</B></DT>
<DD><P>リレー音等の音量を指定します。</P></DD>
</DL>
